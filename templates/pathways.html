<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&family=Geist:wght@400;500;600&display=block" rel="stylesheet">
<style>
:root{--navy:#0A1A33;--purple:#6D4CFF;--ink:#172036;--border:#D8DBE2}
*{margin:0;box-sizing:border-box}
body{width:1080px;height:1350px;background:#fff;font-family:Geist,sans-serif;color:var(--ink);padding:110px 90px 90px;display:flex;flex-direction:column}
.eyebrow{font-weight:600;letter-spacing:.12em;color:var(--purple);font-size:24px;margin-bottom:34px}
h1{font-family:Lora,serif;font-weight:500;color:var(--navy);font-size:104px;line-height:1.05;letter-spacing:-.01em}
p.lead{font-size:34px;line-height:1.45;margin-top:40px;max-width:860px}
ul{list-style:none;padding:0;margin-top:70px;border-top:1px solid var(--border)}
li{display:flex;align-items:center;border-bottom:1px solid var(--border);padding:38px 0}
li .n{font-weight:600;color:var(--purple);font-size:24px;width:80px;letter-spacing:.06em}
li .t{font-family:Lora,serif;font-weight:500;color:var(--navy);font-size:46px;flex:1}
li .a{color:var(--purple);font-size:40px}
footer{margin-top:auto;display:flex;justify-content:space-between;align-items:center}
footer img{height:64px}footer span{font-size:26px;color:var(--navy);font-weight:500}
</style></head><body>
<div class="eyebrow">INDEPENDENT TEXAS ELECTRICITY GUIDANCE</div>
<h1>Your personal electricity advisor.</h1>
<p class="lead">We research the market, recommend the right plan, and help you shop again at renewal. All for free.</p>
<ul><li><span class="n">01</span><span class="t">My bill is too high</span><span class="a">→</span></li>
<li><span class="n">02</span><span class="t">My contract is ending</span><span class="a">→</span></li>
<li><span class="n">03</span><span class="t">I'm moving</span><span class="a">→</span></li></ul>
<footer><img src="logo.svg"><span>yourenergyinsider.com</span></footer>
</body></html>
