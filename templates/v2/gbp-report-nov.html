<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Lora:wght@500&family=Geist:wght@400;500;600;700;800&display=block" rel="stylesheet"><style>*{margin:0;box-sizing:border-box}body{width:1200px;height:900px;font-family:Geist,sans-serif;overflow:hidden;position:relative;padding:64px 72px}footer{position:absolute;left:72px;right:72px;bottom:40px;display:flex;justify-content:space-between;align-items:center}footer img{height:50px}footer span{font-size:24px;font-weight:700}
body{background:radial-gradient(120% 90% at 90% 0%,#2A2C7E 0%,#0A1A33 55%);color:#fff}
.tag{display:inline-block;background:#6D4CFF;font-weight:700;font-size:22px;letter-spacing:.12em;padding:12px 22px;border-radius:999px}
h1{font-family:Lora,serif;font-weight:500;font-size:72px;line-height:1.1;margin-top:34px}
.row{display:flex;gap:24px;margin-top:50px;width:660px}
.box{flex:1;border-radius:22px;padding:30px 30px 36px}.c{background:#6D4CFF}.q{border:3px dashed #6D4CFF}

.save{position:absolute;left:760px;right:72px;top:380px;font-size:38px;font-weight:700;line-height:1.3}.save em{font-style:normal;color:#B7A8FF}
.note{position:absolute;left:72px;bottom:112px;font-size:18px;color:#8E93B3}
</style></head><body>
<span class="tag">NOVEMBER RATE CHECK</span>
<h1>What a new customer<br>pays this month</h1>
<div class="row"><div class="box c"><div class="lbl">Lowest offer</div><div class="v">$118</div></div><div class="box q"><div class="lbl">What you pay today</div><div class="v">?</div></div></div>

<footer><img src="logo-white.svg"><span>energyplainly.com</span></footer></body></html>
