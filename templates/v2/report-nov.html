<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&family=Geist:wght@400;500;600;700;800&display=block" rel="stylesheet"><style>*{margin:0;box-sizing:border-box}body{width:1080px;height:1350px;font-family:Geist,sans-serif;overflow:hidden;position:relative}footer{position:absolute;left:80px;right:80px;bottom:60px;display:flex;justify-content:space-between;align-items:center}footer img{height:58px}footer span{font-size:26px;font-weight:700}
body{background:radial-gradient(120% 90% at 90% 0%,#2A2C7E 0%,#0A1A33 55%);color:#fff;padding:90px 80px}
.tag{display:inline-block;background:#6D4CFF;font-weight:700;font-size:26px;letter-spacing:.12em;padding:14px 26px;border-radius:999px}
h1{font-family:Lora,serif;font-weight:500;font-size:76px;line-height:1.1;margin-top:44px}
.row{display:flex;gap:28px;margin-top:64px}
.box{flex:1;border-radius:26px;padding:36px 36px 40px}
.a{background:#1B2547}.q{border:3px dashed #6D4CFF;background:transparent}.q .v{color:#B7A8FF}.c{background:#6D4CFF}

.save{margin-top:54px;font-size:46px;font-weight:700;line-height:1.25}.save em{font-style:normal;color:#B7A8FF}

</style></head><body>
<span class="tag">NOVEMBER RATE CHECK</span>
<h1>What a new customer pays this month</h1>
<div class="row"><div class="box c"><div class="lbl">Lowest offer</div><div class="v">$118</div></div><div class="box a q"><div class="lbl">What you pay today</div><div class="v">?</div></div></div>

<footer><img src="logo-white.svg"><span>energyplainly.com</span></footer></body></html>
